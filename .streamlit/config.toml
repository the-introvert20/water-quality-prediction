[theme]
base = "light"
primaryColor = "#087E8B"
backgroundColor = "#F7FAFB"
secondaryBackgroundColor = "#EDF3F5"
textColor = "#132E40"
linkColor = "#087E8B"
borderColor = "#D9E4E9"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "6px"
buttonRadius = "6px"
font = "sans-serif"
baseFontSize = 16
headingFontSizes = ["36px", "28px", "21px", "18px", "16px", "16px"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
chartCategoricalColors = ["#29485D", "#08949C", "#6C8797", "#C28B45"]
dataframeHeaderBackgroundColor = "#EDF3F5"

[theme.sidebar]
backgroundColor = "#102D3D"
secondaryBackgroundColor = "#1D4052"
textColor = "#F1F7FA"
primaryColor = "#56CFD0"
borderColor = "#345466"
