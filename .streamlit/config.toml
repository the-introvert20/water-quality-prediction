[theme]
base = "light"
primaryColor = "#087E8B"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EDF3F5"
textColor = "#0F172A"
linkColor = "#087E8B"
borderColor = "#E2E8F0"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "6px"
buttonRadius = "6px"
font = "sans-serif"
baseFontSize = 16
headingFontSizes = ["32px", "24px", "19px", "16px", "14px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
chartCategoricalColors = ["#29485D", "#08949C", "#6C8797", "#C28B45"]
dataframeHeaderBackgroundColor = "#F1F5F9"

[theme.sidebar]
backgroundColor = "#0F2537"
secondaryBackgroundColor = "#16364D"
textColor = "#E6F0F5"
primaryColor = "#087E8B"
borderColor = "#1D3B50"
